<header class="app-header">
  <nav class="navbar">
    <div class="nav-brand">
      <h1 (click)="navigateToHome()" style="cursor: pointer;">Events App</h1>
    </div>
    <div class="nav-center">
      <button class="home-btn" (click)="navigateToHome()" aria-label="Go to home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </button>
      <div class="event-types-bar">
        <div class="event-type-item" *ngFor="let eventType of eventTypes" (click)="selectEventType(eventType)" [class.active]="selectedEventTypeId === eventType.id">
          <span class="event-type-name">{{ eventType.name }}</span>
        </div>
      </div>
      <button class="search-btn" (click)="onToggleSearch()" aria-label="Search events">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
    </div>
    <div class="nav-auth">
      <ng-container *ngIf="currentUser; else signInButton">
        <app-profile-dropdown
          [user]="currentUser"
          (logout)="onLogout()">
        </app-profile-dropdown>
      </ng-container>
      <ng-template #signInButton>
        <button class="sign-in-btn" (click)="onOpenAuthModal()">Sign In</button>
      </ng-template>
    </div>
  </nav>
</header>
