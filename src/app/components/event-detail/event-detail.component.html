<!-- Modern Navigation Menu -->
<nav class="modern-nav">
  <div class="nav-container">
    <div class="nav-brand">
      <h1 class="brand-title">Events App</h1>
      <div class="brand-accent"></div>
    </div>

    <div class="nav-menu">
      <div class="menu-toggle" (click)="toggleMenu()">
        <span class="toggle-line"></span>
        <span class="toggle-line"></span>
        <span class="toggle-line"></span>
      </div>

      <div class="menu-overlay" [class.active]="menuOpen" (click)="closeMenu()"></div>

      <div class="menu-content" [class.open]="menuOpen">
        <div class="menu-header">
          <h2>Menu</h2>
          <button class="close-btn" (click)="closeMenu()">&times;</button>
        </div>

        <div class="menu-items">
          <div class="menu-item" (click)="goToMainPage(); closeMenu()">
            <div class="item-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
              </svg>
            </div>
            <div class="item-content">
              <div class="item-title">Home</div>
              <div class="item-subtitle">Back to main page</div>
            </div>
            <div class="item-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="event-detail-container" *ngIf="event">
  <div class="event-header">
    <button class="back-button" (click)="goBack()">← Back to Events</button>
    <h1>{{ event.title }}</h1>
  </div>
  
  <div class="event-content">
    <div class="event-image-container">
      <img [src]="event.image || 'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=800&h=600&fit=crop'" 
           [alt]="event.title"
           (error)="onImageError($event)">
    </div>
    
    <div class="event-info">
      <div class="event-meta">
        <span class="event-type" *ngIf="event.eventType">{{ getEventTypeName(event.eventType) }}</span>
        <span class="event-type" *ngIf="!event.eventType">-</span>
        <span class="event-category" *ngIf="event.category">{{ getCategoryName(event.category) }}</span>
        <span class="event-date">{{ event.date }}</span>
      </div>
      
      <div class="event-description">
        <h3>About this event</h3>
        <p [innerHTML]="event.description"></p>
      </div>
    </div>
  </div>
</div>

<div class="loading" *ngIf="!event">
  Loading event details...
</div>

<div class="error-message" *ngIf="error">
  {{ error }}
</div>

<div class="loading-spinner" *ngIf="loading">
  <div class="spinner"></div>
  <p>Loading event details...</p>
</div>

<div class="event-detail-card" *ngIf="!loading && event">

</div>
