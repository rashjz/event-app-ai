<div class="main-container">
  <!-- Modern Navigation Menu -->
  <nav class="modern-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <h1 class="brand-title">Events App</h1>
        <div class="brand-accent"></div>
      </div>

      <div class="nav-menu">
        <div class="menu-toggle" (click)="toggleMenu()">
          <span class="toggle-line"></span>
          <span class="toggle-line"></span>
          <span class="toggle-line"></span>
        </div>

        <div class="menu-overlay" [class.active]="menuOpen" (click)="closeMenu()"></div>

        <div class="menu-content" [class.open]="menuOpen">
          <div class="menu-header">
            <h2>Categories</h2>
            <button class="close-btn" (click)="closeMenu()">&times;</button>
          </div>

          <div class="menu-items">
            <div
              class="menu-item"
              [class.active]="!selectedCategory"
              (click)="selectCategory(null); closeMenu()">
              <div class="item-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
              </div>
              <div class="item-content">
                <div class="item-title">All Categories</div>
                <div class="item-subtitle">{{ categories.length }} events</div>
              </div>
              <div class="item-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
              </div>
            </div>

            <div
              class="menu-item"
              *ngFor="let category of categories; let i = index"
              [class.active]="selectedCategory?.id === category.id"
              (click)="selectCategory(category); closeMenu()"
              [style.animation-delay]="(i * 0.05) + 's'">
              <div class="item-icon" [style.background-color]="category.color">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                </svg>
              </div>
              <div class="item-content">
                <div class="item-title">{{ category.name }}</div>
                <div class="item-subtitle">Explore events</div>
              </div>
              <div class="item-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="content">
    <div class="events-section">
      <app-events-list [selectedCategory]="selectedCategory"></app-events-list>
    </div>
    
    <div class="chat-section">
      <app-chat></app-chat>
    </div>
  </div>
</div>
