<div class="main-container">
  <!-- Categories Menu -->
  <div class="categories-section">
    <div class="categories-toggle" (click)="toggleMenu()">
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
      <span class="toggle-line"></span>
    </div>

    <div class="categories-overlay" [class.active]="menuOpen" (click)="closeMenu()"></div>

    <div class="categories-menu" [class.open]="menuOpen">
      <div class="menu-header">
        <h2>Categories</h2>
        <button class="close-btn" (click)="closeMenu()">&times;</button>
      </div>

      <div class="menu-items">
        <div class="menu-section">
          <div
            class="menu-item"
            [class.active]="!selectedCategory"
            (click)="selectCategory(null); closeMenu()">
            <div class="item-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
              </svg>
            </div>
            <div class="item-content">
              <div class="item-title">All Categories</div>
              <div class="item-subtitle">{{ categories.length }} events</div>
            </div>
            <div class="item-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
              </svg>
            </div>
          </div>

          <div
            class="menu-item"
            *ngFor="let category of categories; let i = index"
            [class.active]="selectedCategory?.id === category.id"
            (click)="selectCategory(category); closeMenu()"
            [style.animation-delay]="(i * 0.05) + 's'">
            <div class="item-icon" [style.background-color]="category.color">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
              </svg>
            </div>
            <div class="item-content">
              <div class="item-title">{{ category.name }}</div>
              <div class="item-subtitle">Explore events</div>
            </div>
            <div class="item-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="content">
    <div class="events-section">
      <app-events-list [selectedCategory]="selectedCategory" [selectedEventTypeId]="selectedEventTypeId" [selectedEventTypeName]="selectedEventTypeName"></app-events-list>
    </div>
  </div>

  <!-- Chat Overlay -->
  <div class="chat-overlay" [class.visible]="showChat" (click)="toggleChat()">
    <div class="chat-container" (click)="$event.stopPropagation()">
      <div class="chat-header">
        <h3>Chat Assistant</h3>
        <button class="chat-close-btn" (click)="toggleChat()">&times;</button>
      </div>
      <div class="chat-content">
        <app-chat></app-chat>
      </div>
    </div>
  </div>

  <!-- Search Overlay -->
  <app-search-overlay *ngIf="showSearch" (close)="closeSearch()"></app-search-overlay>

  <!-- Floating Chat Button -->
  <button class="floating-chat-btn" (click)="toggleChat()" [class.active]="showChat">
    <svg *ngIf="!showChat" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12c0 1.54.36 3.05 1.05 4.42L2 22l5.58-1.05C9.95 21.64 11.46 22 13 22h7c1.1 0 2-.9 2-2V12c0-5.52-4.48-10-10-10z"/>
    </svg>
    <svg *ngIf="showChat" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
    </svg>
  </button>
</div>
