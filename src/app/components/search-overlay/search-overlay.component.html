<div class="search-overlay" (click)="closeOverlay()">
  <div class="search-container" (click)="$event.stopPropagation()">
    <div class="search-header">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          [formControl]="searchControl"
          placeholder="Search events, concerts, movies, exhibitions..."
          class="search-input"
          (keydown)="onKeyDown($event)"
          aria-label="Search events"
          autocomplete="off"
        >
        <button
          *ngIf="searchControl.value"
          class="clear-btn"
          (click)="clearSearch()"
          aria-label="Clear search"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
          </svg>
        </button>
      </div>
      <button class="close-overlay-btn" (click)="closeOverlay()" aria-label="Close search">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
        </svg>
      </button>
    </div>

    <!-- Autocomplete Suggestions -->
    <div class="suggestions-list" *ngIf="showSuggestions">
      <div
        *ngFor="let suggestion of autocompleteSuggestions"
        class="suggestion-item"
        (click)="selectSuggestion(suggestion)"
      >
        {{ suggestion }}
      </div>
    </div>

    <!-- Search Results -->
    <div class="search-results" *ngIf="!isLoading && !hasError">
      <div *ngIf="noResults && searchControl.value" class="no-results">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <p>No events found. Try adjusting your search.</p>
      </div>

      <div *ngIf="searchResults.length > 0" class="results-list">
        <div *ngFor="let event of searchResults" class="result-item" [routerLink]="['/event', event.id]">
          <div class="result-image">
            <img [src]="event.image || '/assets/default-event.jpg'" [alt]="event.title" loading="lazy">
          </div>
          <div class="result-content">
            <h3 class="result-title">{{ event.title }}</h3>
            <p class="result-description">{{ event.description | slice:0:100 }}...</p>
            <div class="result-meta">
              <span class="result-date">{{ formatDate(event.date) }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner"></div>
      <p>Searching...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError" class="error-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
      <p>Search failed. Please try again.</p>
      <button class="retry-btn" (click)="performSearch(searchControl.value)">Retry</button>
    </div>
  </div>
</div>
